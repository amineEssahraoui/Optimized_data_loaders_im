# VLM Preprocessing Pipeline -- Main Configuration
# Every configurable parameter for the pipeline lives here.
# Behavior is changed by editing this file, not by editing code.

# Dataset source and column mapping
dataset:
  # HuggingFace dataset identifier
  hf_dataset_id: "trannhiem/TranNhiem-Vietnamese-ImageText-Reasoning"

  # HuggingFace dataset configuration/subset name
  # "preview" = flat schema (~300 rows), "full" = conversation schema (~544K rows)
  hf_config_name: "preview"

  # Dataset split to load
  split: "train"

  # Map canonical field names to dataset-specific column names.
  # Change these when switching to a different VQA dataset.
  column_mapping:
    image: "image"
    question: "question"
    answer: "model_answer"
    id: "id"
    reasoning: "model_reasoning"

  # Limit number of samples to process (null = process all)
  max_samples: null

  # Whether to use HuggingFace streaming mode
  streaming: false

# Image preprocessing
image:
  # Target image dimensions (height, width) after resize/crop
  target_size: [384, 384]

  # Resize strategy: "resize_and_pad", "center_crop", "resize"
  resize_strategy: "resize_and_pad"

  # Target color space after decoding
  color_space: "RGB"

  # Per-channel normalization mean (ImageNet default)
  normalization_mean: [0.485, 0.456, 0.406]

  # Per-channel normalization std (ImageNet default)
  normalization_std: [0.229, 0.224, 0.225]

  # Interpolation method: "bicubic", "bilinear", "lanczos", "nearest"
  interpolation: "bicubic"

  # Pixel value used for padding (0-255)
  pad_value: 0

  # Maximum image dimension for aspect-ratio-preserving resize (v2 format)
  max_image_dim: 384

  # Storage data type in binary shards:
  #   "float32" -- v1 format, normalized at preprocessing time
  #   "uint8"   -- v2 format, raw pixels, normalization deferred to C++ loader
  storage_dtype: "uint8"

  # Enable dynamic padding (variable-size images, padded at batch time)
  dynamic_padding: true

# Text tokenization
tokenizer:
  # Pretrained tokenizer model (HuggingFace hub identifier or local path)
  model_name_or_path: "inceptionai/jais-13b-chat"

  # Maximum sequence length after tokenization
  max_length: 512

  # Padding strategy: "max_length", "longest", "do_not_pad"
  padding: "max_length"

  # Whether to truncate sequences exceeding max_length
  truncation: true

  # Whether to allow custom tokenizer code from the model repo
  trust_remote_code: true

  # Whether to add BOS/EOS special tokens
  add_special_tokens: true

  # Text padding strategy:
  #   false (default) -- static: pad every sequence to max_length at preprocessing
  #   true            -- dynamic: tokenize without padding, defer to batch collation
  dynamic_text_padding: false

# Binary shard output
shard:
  # Directory where processed shards are written
  output_dir: "./output/shards"

  # Target size per shard file in megabytes
  shard_size_mb: 256

  # Maximum number of samples per shard file (null = size-based only)
  max_samples_per_shard: null

  # Compression algorithm (null = uncompressed, "lz4" = fast compression)
  compression: null

  # Byte alignment for memory-mapped access (must be a power of 2)
  alignment_bytes: 64

  # Binary shard format version: 1 (legacy float32) or 2 (uint8, recommended)
  format_version: 2

  # Path for the shard manifest JSON output (null = no manifest)
  manifest_path: "./output/shards/manifest.json"

# Pipeline-level parameters

# Shuffling strategy: "none", "local" (in-shard), "global" (cross-shard)
shuffling: "none"

# Number of parallel preprocessing workers (0 = single-threaded)
num_workers: 4

# Logging verbosity: "DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"
log_level: "INFO"

# Global random seed for reproducibility
seed: 42

# How often (in samples) to log progress during processing
progress_interval: 50

# Default chunk size for the streaming pipeline when max_samples_per_shard
# is not configured
streaming_chunk_size: 500

# If true, abort on first sample processing error.
# If false, skip failed samples and continue.
fail_fast: false
